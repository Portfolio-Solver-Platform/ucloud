- name: download headscale
  get_url:
    url: https://github.com/juanfont/headscale/releases/download/v0.23.0/headscale_0.23.0_linux_amd64.deb
    dest: /tmp/headscale.deb
    mode: "u+rwx"

- name: install headscale
  apt:
    deb: /tmp/headscale.deb

- name: copy headscale config to vm
  copy:
    src: "./headscale.yml"
    dest: "/etc/headscale/config.yaml"

- name: install supervisor
  apt:
    name: supervisor
    state: present
    update_cache: yes

- name: create headscale supervisor config
  copy:
    content: |
      [program:headscale]
      command=/usr/bin/headscale serve
      autostart=true
      autorestart=true
      stderr_logfile=/var/log/headscale.err.log
      stdout_logfile=/var/log/headscale.out.log
      user=root
    dest: /etc/supervisor/conf.d/headscale.conf
  notify: restart supervisor

- name: ensure supervisor is running
  shell: |
    if ! pgrep supervisord > /dev/null; then
      supervisord -c /etc/supervisor/supervisord.conf
    fi

- name: reload supervisor and start headscale
  shell: |
    supervisorctl reread
    supervisorctl update
    supervisorctl start headscale
  ignore_errors: yes

- name: create headscale user
  shell: |
    if $(headscale users list | grep -q ctf)
    then
      echo "user ctf exists"
    else
      headscale users create ctf
    fi

- name: generate headscale key
  shell: |
    if [ ! -f ~/headscale_key ]; then
      headscale preauthkeys create --user ctf >> ~/headscale_key
    fi

- name: fetch headscale key file
  fetch:
    src: "~/headscale_key"
    dest: "../tailscale_key"
    flat: yes
